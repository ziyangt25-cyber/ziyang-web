<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      if (location.protocol !== "file:") {
        return;
      }
      var page = decodeURIComponent(location.pathname.split("/").pop() || "index.html");
      location.replace("http://127.0.0.1:8765/" + page);
    })();
  </script>
  <title>东京 - Ziyang Web</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="style.css?v=4">
  <style>
    .trip-photos__grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    .photo-item__open {
      display: block;
      width: 100%;
      height: 180px;
      padding: 0;
      border: none;
      background: #e8f4fc;
      overflow: hidden;
      border-radius: 10px;
      cursor: zoom-in;
    }
    .photo-item__open img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 10px;
      border: 1px solid rgba(26, 95, 180, 0.12);
    }
  </style>
</head>
<body id="page-top" data-page-title="page.tokyo.title">
  <nav class="site-nav">
    <a class="nav-brand" href="index.html">Ziyang Web</a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav.home">首页</a>
      <a href="about.html" data-i18n="nav.about">关于我</a>
      <a href="contact.html" data-i18n="nav.contact">联系我</a>
      <button type="button" id="lang-toggle" class="lang-toggle" data-i18n="lang.toggle">English</button>
    </div>
  </nav>

  <main class="page page--trip">
    <a class="trip-back" href="index.html" data-i18n="trip.back">← 返回首页</a>
    <h1 data-i18n="home.card.tokyo.title">东京</h1>
    <p class="trip-highlight" data-i18n="home.card.tokyo.highlight">亮点：涩谷十字路口与东京塔夜景</p>
    <p data-i18n="home.card.tokyo.desc">记录在东京的一段旅程。</p>
    <p class="trip-detail" data-i18n="home.card.tokyo.detail">
      东京节奏很快，但交通很方便。我喜欢在傍晚看城市灯光，感觉整座城市都在发光。
    </p>
    <ul class="gallery-card__tags trip-tags">
      <li data-i18n="home.card.tokyo.tag1">夜景</li>
      <li data-i18n="home.card.tokyo.tag2">购物</li>
      <li data-i18n="home.card.tokyo.tag3">拉面</li>
    </ul>

    <section class="trip-photos" aria-labelledby="tokyo-photos-title">
      <h2 id="tokyo-photos-title" data-i18n="trip.photos.title">旅行照片</h2>
      <p class="trip-photos-hint" data-i18n="trip.photos.zoomHint">点击照片可放大</p>
      <div class="trip-photos__grid trip-photos__grid--four">
        <figure class="photo-item">
          <button type="button" class="photo-item__open" data-src="images/tokyo1.jpg">
            <img src="images/tokyo1.jpg" alt="" data-i18n-alt="trip.tokyo.photo1.alt">
          </button>
          <figcaption data-i18n="trip.tokyo.photo1.caption">东京照片 1</figcaption>
        </figure>
        <figure class="photo-item">
          <button type="button" class="photo-item__open" data-src="images/tokyo2.jpg">
            <img src="images/tokyo2.jpg" alt="" data-i18n-alt="trip.tokyo.photo2.alt">
          </button>
          <figcaption data-i18n="trip.tokyo.photo2.caption">东京照片 2</figcaption>
        </figure>
        <figure class="photo-item">
          <button type="button" class="photo-item__open" data-src="images/tokyo3.jpg">
            <img src="images/tokyo3.jpg" alt="" data-i18n-alt="trip.tokyo.photo3.alt">
          </button>
          <figcaption data-i18n="trip.tokyo.photo3.caption">东京照片 3</figcaption>
        </figure>
        <figure class="photo-item">
          <button type="button" class="photo-item__open" data-src="images/tokyo4.jpg">
            <img src="images/tokyo4.jpg" alt="" data-i18n-alt="trip.tokyo.photo4.alt">
          </button>
          <figcaption data-i18n="trip.tokyo.photo4.caption">东京照片 4</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Ziyang Web。保留所有权利。</p>
    <p>
      <a href="mailto:ziyangt25@gmail.com">ziyangt25@gmail.com</a>
    </p>
  </footer>

  <div id="photo-viewer" class="photo-viewer" hidden>
    <button type="button" class="photo-viewer__close" data-i18n="lightbox.close">关闭</button>
    <div class="photo-viewer__stage">
      <button type="button" class="photo-viewer__nav photo-viewer__nav--prev" data-i18n-aria="lightbox.prev" aria-label="上一张">‹</button>
      <img class="photo-viewer__img" src="" alt="">
      <button type="button" class="photo-viewer__nav photo-viewer__nav--next" data-i18n-aria="lightbox.next" aria-label="下一张">›</button>
    </div>
    <p class="photo-viewer__caption"></p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var viewer = document.getElementById("photo-viewer");
      if (!viewer) return;
      var viewerImg = viewer.querySelector(".photo-viewer__img");
      var viewerCaption = viewer.querySelector(".photo-viewer__caption");
      var closeBtn = viewer.querySelector(".photo-viewer__close");
      var prevBtn = viewer.querySelector(".photo-viewer__nav--prev");
      var nextBtn = viewer.querySelector(".photo-viewer__nav--next");
      var openButtons = Array.prototype.slice.call(document.querySelectorAll(".photo-item__open"));
      var photos = [];
      var currentIndex = 0;
      if (!openButtons.length) return;
      openButtons.forEach(function (button) {
        var figure = button.closest("figure");
        var captionEl = figure ? figure.querySelector("figcaption") : null;
        photos.push({ src: button.getAttribute("data-src"), caption: captionEl ? captionEl.textContent : "" });
      });
      function updateNavButtons() {
        prevBtn.hidden = currentIndex === 0;
        nextBtn.hidden = currentIndex === photos.length - 1;
      }
      function showPhoto(index) {
        currentIndex = Math.max(0, Math.min(index, photos.length - 1));
        var photo = photos[currentIndex];
        viewerImg.src = photo.src;
        viewerImg.alt = photo.caption;
        viewerCaption.textContent = photo.caption;
        updateNavButtons();
      }
      function openViewer(index) { showPhoto(index); viewer.hidden = false; document.body.style.overflow = "hidden"; }
      function closeViewer() { viewer.hidden = true; viewerImg.removeAttribute("src"); document.body.style.overflow = ""; }
      openButtons.forEach(function (button, index) {
        button.addEventListener("click", function (e) { e.preventDefault(); openViewer(index); });
      });
      closeBtn.addEventListener("click", closeViewer);
      prevBtn.addEventListener("click", function (e) { e.stopPropagation(); if (currentIndex > 0) showPhoto(currentIndex - 1); });
      nextBtn.addEventListener("click", function (e) { e.stopPropagation(); if (currentIndex < photos.length - 1) showPhoto(currentIndex + 1); });
      viewer.addEventListener("click", function (e) { if (e.target === viewer) closeViewer(); });
      document.addEventListener("keydown", function (e) {
        if (viewer.hidden) return;
        if (e.key === "Escape") closeViewer();
        else if (e.key === "ArrowLeft" && currentIndex > 0) showPhoto(currentIndex - 1);
        else if (e.key === "ArrowRight" && currentIndex < photos.length - 1) showPhoto(currentIndex + 1);
      });
    });
  </script>
  <script src="translate.js?v=4"></script>
</body>
</html>

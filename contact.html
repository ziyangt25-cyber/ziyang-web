<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      if (location.protocol !== "file:") {
        return;
      }
      var page = decodeURIComponent(location.pathname.split("/").pop() || "index.html");
      location.replace("http://127.0.0.1:8765/" + page);
    })();
  </script>
  <title>联系我 - Ziyang Web</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body data-page-title="page.contact.title">
  <nav class="site-nav">
    <a class="nav-brand" href="index.html">Ziyang Web</a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav.home">首页</a>
      <a href="about.html" data-i18n="nav.about">关于我</a>
      <a href="contact.html" aria-current="page" data-i18n="nav.contact">联系我</a>
      <button type="button" id="lang-toggle" class="lang-toggle" data-i18n="lang.toggle">English</button>
    </div>
  </nav>

  <main class="page page--form">
    <h1 data-i18n="contact.heading">联系我</h1>
    <p class="form-intro" data-i18n="contact.intro">填写下面的表单。目前是练习版，不会真的发到邮箱。</p>

    <form id="contact-form" class="contact-form" action="#" method="post">
      <label class="form-field">
        <span data-i18n="contact.form.name">你的姓名</span>
        <input type="text" name="name" required data-i18n-placeholder="contact.form.name.placeholder" placeholder="例如：小明">
      </label>

      <label class="form-field">
        <span data-i18n="contact.form.email">电子邮箱</span>
        <input type="email" name="email" required data-i18n-placeholder="contact.form.email.placeholder" placeholder="例如：you@example.com">
      </label>

      <label class="form-field">
        <span data-i18n="contact.form.message">留言内容</span>
        <textarea name="message" rows="5" required data-i18n-placeholder="contact.form.message.placeholder" placeholder="想说的话写在这里…"></textarea>
      </label>

      <button type="submit" class="btn-submit" data-i18n="contact.form.submit">发送留言</button>
    </form>

    <p id="form-success" class="form-success" hidden data-i18n="contact.form.success">
      谢谢！你的留言已发送，我会尽快回复。
    </p>

    <p id="form-error" class="form-error" hidden role="alert"></p>
  </main>

  <footer class="site-footer">
    <p>© 2026 Ziyang Web。保留所有权利。</p>
    <p>
      <a href="mailto:ziyangt25@gmail.com">ziyangt25@gmail.com</a>
    </p>
  </footer>

  <script src="translate.js?v=4"></script>
  <script src="contact-config.js?v=4"></script>
  <script src="contact.js?v=4"></script>
</body>
</html>
